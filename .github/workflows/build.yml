name: build ipa

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erosion-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select newest Xcode
        run: |
          set -uo pipefail
          # The image ships ~13 Xcodes (26.0.1 ... 26.6 plus /Applications/Xcode.app).
          # A plain `for cand in /Applications/Xcode*.app; do ... break` picks the
          # FIRST glob hit, which is alphabetically Xcode_26.0.1 -- the OLDEST one.
          # Its iPhoneOS platform is what triggers "iOS 26.0 is not installed".
          # Pick the highest version instead, using sort -V on CFBundleShortVersionString.
          BEST=""
          BESTV="0"
          for cand in /Applications/Xcode*.app /Applications/Xcode.app; do
            [ -d "$cand/Contents/Developer/Platforms/iPhoneOS.platform" ] || continue
            v=$(defaults read "$cand/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "0")
            if [ "$(printf '%s\n%s\n' "$BESTV" "$v" | sort -V | tail -1)" = "$v" ]; then
              BEST="$cand"; BESTV="$v"
            fi
          done
          APP="$BEST"
          if [ -n "$APP" ]; then
            sudo xcode-select -s "$APP"
            export DEVELOPER_DIR="$APP/Contents/Developer"
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          echo "selected: $APP (version $BESTV)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: diagnose destinations
        run: |
          set -uo pipefail
          echo "--- iPhoneOS SDKs present ---"
          ls /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs 2>/dev/null || true
          echo "--- DeviceSupport ---"
          ls /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport 2>/dev/null || true
          echo "--- xcodebuild -showdestinations ---"
          xcodebuild -showdestinations -project Erosion.xcodeproj -scheme Erosion -sdk iphoneos 2>&1 | head -n 60 || true

      - name: resolve SPM packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Erosion.xcodeproj -scheme Erosion \
            -derivedDataPath build

      - name: build
        run: |
          set -uo pipefail
          # Two shell pitfalls burned us before -- both are fixed here:
          #  1) `cmd | tail || true` resets $PIPESTATUS to (0), so rc ALWAYS
          #     looked like success. That is literally how the 1.8 KB
          #     empty-shell IPA got packaged and shipped. Capture the real code
          #     with `|| rc=$?` instead (keeps `set -e` happy too).
          #  2) `[ -n "$x" ] && VAR=...` returns 1 on a short-circuit and, under
          #     the runner's `bash -e`, kills the whole step -- which silently
          #     prevented attempts 2 and 3 from ever running. Use real if/else.
          # Destination resolution on this runner is RACY, not deterministic:
          #   * "generic/platform=iOS" / "platform=iOS,name=Any iOS Device" always
          #     die with rc=70 "iOS 26.0 is not installed" (the image has the
          #     iPhoneOS 26.0 SDK but not the 26.0 platform component).
          #   * Running with NO destination USUALLY dies with rc=70 "Found no
          #     destinations", but intermittently resolves and builds for real
          #     (verified: run 37552106105 attempt 3 compiled arm64 successfully,
          #     including ZIPFoundation + PartyUI; identical invocations in runs
          #     37552507869 / 37552902636 got rc=70).
          # So the strategy is: fire one warm-up attempt, then retry the
          # no-destination form several times -- a failing attempt costs ~3s.
          destinations=("generic/platform=iOS" "" "" "" "" "" "platform=iOS,name=Any iOS Device")
          for attempt in 0 1 2 3 4 5 6; do
            d="${destinations[$attempt]}"
            echo "::group::xcodebuild attempt $((attempt+1)) destination='${d:-<none>}'"
            args=(-project Erosion.xcodeproj -scheme Erosion
                  -configuration Release -sdk iphoneos -derivedDataPath build)
            if [ -n "$d" ]; then
              args+=(-destination "$d")
            fi
            rc=0
            xcodebuild "${args[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              build > "/tmp/xcb-$attempt.log" 2>&1 || rc=$?
            tail -n 200 "/tmp/xcb-$attempt.log"
            echo "::endgroup::"

            ok=0
            if [ "$rc" -eq 0 ]; then
              APP_PATH=""
              if [ -d build/Build/Products/Release-iphoneos ]; then
                APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'Erosion.app' -print -quit)"
              fi
              if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/Erosion" ]; then
                sz=$(stat -f%z "$APP_PATH/Erosion")
                if [ "$sz" -gt 1000000 ]; then
                  echo "binary OK ($sz bytes) -> success"
                  ok=1
                else
                  echo "::warning::binary too small ($sz bytes)"
                fi
              else
                echo "::warning::no Erosion binary produced (app='${APP_PATH:-none}')"
              fi
            else
              echo "xcodebuild exited ${rc}"
            fi
            if [ "$ok" -eq 1 ]; then exit 0; fi
            echo "attempt $((attempt+1)) rc=${rc} -> retrying"
            rm -rf build/Build/Intermediates.noindex
          done
          exit 1

      - name: package ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name 'Erosion.app' -print -quit)"
          test -n "$APP_PATH" || { echo "::error::Erosion.app not produced"; exit 1; }
          test -f "$APP_PATH/Erosion" || { echo "::error::Erosion binary missing"; exit 1; }
          rm -rf "$APP_PATH/_CodeSignature" "$APP_PATH/embedded.mobileprovision"
          /usr/bin/codesign --force --sign - --timestamp=none \
            --generate-entitlement-der "$APP_PATH" || true
          /usr/bin/codesign -vvvv --deep "$APP_PATH" || true
          rm -rf Payload Erosion.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload Erosion.ipa
          rm -rf Payload
          sz=$(stat -f%z Erosion.ipa)
          echo "Erosion.ipa size: $sz bytes"
          if [ "$sz" -lt 1000000 ]; then
            echo "::error::Erosion.ipa suspiciously small ($sz bytes)"
            exit 1
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-unsigned-ipa
          path: Erosion.ipa
          if-no-files-found: error
